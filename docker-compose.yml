services:
  db:
    image: postgres:16-alpine
    container_name: oyster-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oyster
      POSTGRES_PASSWORD: oyster
      POSTGRES_DB: oyster
    ports:
      - "127.0.0.1:5433:5432"  # local only
    volumes:
      - oyster-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oyster -d oyster"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oyster-pgdata:
